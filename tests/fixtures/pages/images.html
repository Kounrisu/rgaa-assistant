<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Images</title></head>
<body>
<main>
  <h1>Images</h1>
  <img src="https://example.test/a.png" alt="Un chat noir">
  <img src="https://example.test/b.png">
  <img src="https://example.test/c.png" alt="">
  <img src="https://example.test/photo-123.jpg" alt="photo-123.jpg">
  <img src="https://example.test/d.png" alt="" aria-hidden="true">
  <img src="https://example.test/e.png" alt="" role="presentation">
  <img src="https://example.test/f.png" aria-label="Libellé ARIA" title="Titre">
  <img src="https://example.test/g.png" aria-labelledby="cap1">
  <p id="cap1">Légende liée</p>
  <figure><img src="https://example.test/h.png" alt="Dans une figure"><figcaption>Une légende</figcaption></figure>
  <a href="/lien"><img src="https://example.test/i.png" alt="Accueil"> Texte du lien</a>
  <svg width="40" height="40" role="img" aria-label="Icône"><title>Titre SVG</title><circle cx="20" cy="20" r="10"/><rect width="5" height="5"/></svg>
  <svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4"/></svg>
  <div role="img" aria-label="Div image"></div>
  <input type="image" src="https://example.test/btn.png" alt="Envoyer">
  <map name="m1"><area shape="rect" coords="0,0,10,10" href="/zone" alt="Zone 1"></map>
  <img src="https://example.test/map.png" usemap="#m1" alt="Carte">
  <canvas width="50" height="50"></canvas>
  <object type="image/png" data="https://example.test/o.png"></object>
  <div style="display:none"><img src="https://example.test/hidden.png" alt="Caché"></div>
  <dialog open><img src="https://example.test/dlg.png" alt="Dans un dialogue"></dialog>
</main>
</body>
</html>
