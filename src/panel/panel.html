<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RGAA Assistant — Images</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="auditbar" role="region" aria-label="Current audit" data-i18n-attrs="aria-label">
      <span class="auditbar-label" data-i18n>Audit</span>
      <button id="audit-name-btn" type="button" class="audit-name" title="Rename this audit" data-i18n-attrs="title"></button>
      <span id="save-state" class="pill" role="status" aria-live="polite"></span>
      <span id="backup-state" class="pill muted"></span>
      <span class="spacer"></span>
      <button id="audits-btn" type="button" aria-pressed="false" data-i18n>Audits</button>
      <button id="open-file-btn" type="button" title="Reopen an audit saved earlier in a .rgaa.json file, to carry on" data-i18n data-i18n-attrs="title">Open from a file</button>
      <button id="save-file-btn" type="button" title="Download the whole audit as a .rgaa.json file, to keep or to reopen later" data-i18n data-i18n-attrs="title">Save to file</button>
      <div class="lang" role="group" aria-label="Language" data-i18n-attrs="aria-label">
        <button id="lang-fr" type="button" aria-pressed="true">FR</button>
        <button id="lang-en" type="button" aria-pressed="false">EN</button>
      </div>
    </div>

    <header class="topbar">
      <div class="brand">
        <h1>RGAA Assistant</h1>
        <p data-i18n>RGAA 4.1 audit</p>
      </div>
      <div class="top-info">
        <div id="page-summary" class="theme-summary page-totals" data-scope="page" aria-label="Totals of the chosen themes on this page" data-i18n-attrs="aria-label"></div>
        <p id="status" role="status" class="status top-status"></p>
      </div>
      <div class="actions">
        <a class="link-btn" href="../rgaa/rgaa.html" target="_blank" rel="noreferrer" data-i18n>RGAA coverage ↗</a>
        <button id="sample-btn" type="button" aria-pressed="false" title="Register the pages to audit, edit their URLs and the audit fields" data-i18n data-i18n-attrs="title">Audit pages sample</button>
        <button id="checks-btn" type="button" aria-pressed="false" title="Keyboard, zoom, screen reader… the checks a script cannot do, and import of axe results" data-i18n data-i18n-attrs="title" disabled>Manual checks</button>
        <button id="results-btn" type="button" disabled aria-pressed="false" title="Results of this page, one line per official test" data-i18n data-i18n-attrs="title">Audit page results</button>
        <button id="audit-btn" type="button" disabled aria-pressed="false" title="All pages of the sample: dashboard, grid and Excel export" data-i18n data-i18n-attrs="title">Audit pages overview</button>
      </div>
    </header>

    <div class="pagebar">
      <label for="page-select" data-i18n>Page</label>
      <select id="page-select"></select>
      <span id="live-url" class="live-url"></span>
      <button id="scan-btn" type="button" class="primary">Scan page</button>
      <button id="reset-page-btn" type="button" class="ghost-btn danger" disabled title="Clear the scans and every answer of this page; keep its URL, title and themes" data-i18n data-i18n-attrs="title">Reset page</button>
      <button id="delete-page-btn" type="button" class="ghost-btn" disabled data-i18n>Remove page</button>
    </div>
    <nav id="themebar" class="themebar" aria-label="RGAA themes" data-i18n-attrs="aria-label" hidden></nav>
    <div id="nav-banner" class="banner" role="status" hidden>
      <span id="nav-banner-text"></span>
      <button id="nav-banner-btn" type="button"></button>
    </div>
    <div id="new-banner" class="banner" role="status" hidden>
      <span id="new-banner-text"></span>
      <button id="rescan-btn" type="button" data-i18n>Add them (Rescan)</button>
    </div>

    <header id="images-head" class="theme-head" hidden>
      <div>
        <h2 data-i18n>1. Images</h2>
        <p class="hint-line" data-i18n>Every image of the page, reviewed one by one.</p>
        <div id="images-summary" class="theme-summary" data-theme="1" aria-label="Images: totals" data-i18n-attrs="aria-label"></div>
      </div>
      <div id="tools" class="tools" role="toolbar" aria-label="Tools of this theme" data-i18n-attrs="aria-label" hidden>
        <button id="boxes-btn" type="button" disabled aria-pressed="true" title="Show or hide the numbered boxes on the page" data-i18n-attrs="title">Hide boxes</button>
        <button id="alt-btn" type="button" aria-pressed="false" title="Write the alternative text (or its absence) next to each image on the page" data-i18n-attrs="title">Alt text: off</button>
        <button id="tint-btn" type="button" aria-pressed="true" title="The thick yellow border and wash on the element you are looking at: turn it off to get a thin outline and see its real colours" data-i18n-attrs="title">Yellow highlight: on</button>
        <button id="clear-btn" type="button" disabled title="Remove the boxes from the page; the findings stay in the audit" data-i18n data-i18n-attrs="title">Remove boxes</button>
      </div>
    </header>

    <main id="app" class="layout" hidden>
      <nav class="list-pane" aria-label="Images found on the page" data-i18n-attrs="aria-label">
        <div id="filters" class="filters" role="group" aria-label="Filter images" data-i18n-attrs="aria-label"></div>
        <ol id="element-list"></ol>
      </nav>
      <section id="detail" class="detail-pane" aria-label="Image details" data-i18n-attrs="aria-label"></section>
    </main>

    <section id="theme-view" class="results" aria-label="Theme checklist" data-i18n-attrs="aria-label" hidden></section>

    <section id="results" class="results" aria-label="Page results" data-i18n-attrs="aria-label" hidden></section>
    <section id="audit" class="results" aria-label="Audit overview" data-i18n-attrs="aria-label" hidden></section>
    <section id="sample" class="results" aria-label="Sample of pages" data-i18n-attrs="aria-label" hidden></section>
    <section id="checks" class="results" aria-label="Manual checks" hidden></section>
    <input id="tool-file" type="file" accept=".json,application/json" hidden />
    <section id="audits" class="results" aria-label="Audits" data-i18n-attrs="aria-label" hidden></section>
    <input id="import-file" type="file" accept=".json,application/json" hidden />

    <section id="empty" class="empty">
      <h2 id="empty-title">Start by registering the pages of your sample</h2>
      <p id="empty-text">Open the first page in the browser and add it as page 1. You scan it afterwards.</p>
      <p>
        <button id="empty-add-btn" type="button" class="primary-cta">Add the current URL as P01</button>
        <button id="empty-go-btn" type="button" class="primary-cta" hidden>Open the page in the browser</button>
      </p>
      <ol id="empty-steps"></ol>
    </section>

    <!-- DevTools panels cannot show the browser's confirm() popup, so confirmations live here -->
    <dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title">Are you sure?</h2>
        <p id="confirm-text"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel" type="button" autofocus data-i18n>Cancel</button>
          <button id="confirm-ok" type="button" class="danger-solid">Confirm</button>
        </div>
      </form>
    </dialog>

    <dialog id="text-dialog" class="confirm" aria-labelledby="text-title">
      <form method="dialog" id="text-form">
        <h2 id="text-title"></h2>
        <label class="field"><span id="text-label"></span><input id="text-input" type="text" maxlength="120" autocomplete="off" /></label>
        <div class="confirm-actions">
          <button id="text-cancel" type="button" data-i18n>Cancel</button>
          <button id="text-ok" type="submit" class="primary" data-i18n>OK</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="panel.ts"></script>
  </body>
</html>
